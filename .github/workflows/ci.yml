# Las pruebas, antes de fusionar.
#
# Mismo motivo y misma forma que `ci.yml` en Tamix-social-media: corre en
# cada pull request y en cada push a `main`, no toca AWS ni pide un solo
# secreto, y es la única casilla que hace falta exigir en la protección de
# la rama.
name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  studio-api:
    name: Studio API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/studio-api/package-lock.json

      - run: npm ci
        working-directory: services/studio-api

      - name: Comprobar tipos
        working-directory: services/studio-api
        run: npm run typecheck

      # Las reglas de dominio —programar en el pasado, la escalera de
      # reintentos, la firma de un webhook— se prueban puras, sin DynamoDB ni
      # red, igual que en services/social-api de Tamix.
      - name: Pruebas
        working-directory: services/studio-api
        run: npm test

      - name: Construir
        working-directory: services/studio-api
        run: npm run build

  web:
    name: Panel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Comprobar tipos
        working-directory: web
        run: npm run typecheck

      - name: Construir
        working-directory: web
        run: npm run build

  studio-infra:
    name: Infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-infra/package-lock.json

      - run: npm ci
        working-directory: studio-infra

      # Que las dos listas de CORS —la puerta de API Gateway y el enrutador
      # de Hono— no se hayan separado, sin desplegar nada.
      - name: Pruebas
        working-directory: studio-infra
        run: npm test

  listo:
    name: Todo en verde
    runs-on: ubuntu-latest
    needs: [studio-api, web, studio-infra]
    if: always()
    steps:
      - name: Comprobar que ninguno falló
        run: |
          echo "Studio API:      ${{ needs.studio-api.result }}"
          echo "Panel:           ${{ needs.web.result }}"
          echo "Infraestructura: ${{ needs.studio-infra.result }}"
          [ "${{ needs.studio-api.result }}" = "success" ] \
            && [ "${{ needs.web.result }}" = "success" ] \
            && [ "${{ needs.studio-infra.result }}" = "success" ] \
            || { echo "Algo no pasó."; exit 1; }
